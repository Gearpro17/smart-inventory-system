services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: inventory_management
      MYSQL_USER: inventory
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-inventory_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-inventory_root_dev_password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: inventory_management
      DB_USER: inventory
      DB_PASSWORD: ${MYSQL_PASSWORD:-inventory_dev_password}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  webapp:
    build:
      context: ./webapp
      dockerfile: Dockerfile
    environment:
      NG_ALLOWED_HOSTS: localhost,127.0.0.1
    ports:
      - "4200:4000"
    depends_on:
      - api

volumes:
  mysql_data:
