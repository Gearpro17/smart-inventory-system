<div class="section">
  <span class="section-title">OVERVIEW</span>
  <div class="section-btns">
    <a class="dashboard-btn" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      <img ngSrc="{{DASHBOARD_IMG}}" width="20" height="20" alt="Dashboard">
      <span>Dashboard</span>
    </a>
  </div>
</div>

<div class="section">
  <span class="section-title">CATALOGUE</span>
  <div class="section-btns">
    <a *ngIf="auth.can('INVENTORY_READ')" class="dashboard-btn" routerLink="/products" routerLinkActive="active">
      <img ngSrc="{{PRODUCTS_IMG}}" width="20" height="20" alt="Products">
      <span>Products</span>
    </a>
    <a *ngIf="auth.can('SUPPLIER_READ')" class="dashboard-btn" routerLink="/suppliers" routerLinkActive="active">
      <img ngSrc="{{SUPPLIERS_IMG}}" width="20" height="20" alt="Suppliers">
      <span>Suppliers</span>
    </a>
  </div>
</div>

<div class="section">
  <span class="section-title">OPERATIONS</span>
  <div class="section-btns">
    <a *ngIf="auth.can('MOVEMENT_READ')" class="dashboard-btn" routerLink="/movements" routerLinkActive="active">
      <img ngSrc="{{MOVEMENTS_IMG}}" width="24" height="24" alt="Movements">
      <span>Movements</span>
    </a>
    <a *ngIf="auth.can('REORDER_READ')" class="dashboard-btn" routerLink="/reorder" routerLinkActive="active">
      <img ngSrc="{{REORDER_IMG}}" width="20" height="20" alt="Reorder">
      <span>Reorder</span>
    </a>
  </div>
</div>

<div class="section">
  <span class="section-title">SYSTEM</span>
  <div class="section-btns">
    <a *ngIf="auth.can('USER_MANAGE')" class="dashboard-btn" routerLink="/access" routerLinkActive="active">
      <img ngSrc="{{ACCESS_IMG}}" width="20" height="20" alt="Access">
      <span>Access & roles</span>
    </a>
  </div>
</div>
