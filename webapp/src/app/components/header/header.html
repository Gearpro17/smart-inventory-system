<header class="header-container">
  <div class="header-left">
    <div class="logo-box">
      <img ngSrc="{{APP_LOGO}}" width="24" height="24" alt="StockFlow logo">
    </div>
    <p class="app-name">StockFlow</p>
  </div>
  <div class="header-right">
    @if (auth.currentSession; as session) {
      <div class="account-menu" [class.is-open]="accountMenuOpen()"
           (mouseenter)="openAccountMenu()" (mouseleave)="closeAccountMenuOnMouseLeave($event)"
           (focusin)="openAccountMenu()" (focusout)="closeAccountMenuOnFocusOut($event)"
           (keydown.escape)="closeAccountMenuOnEscape($event)">
        <button type="button" class="account-trigger" [attr.aria-label]="'Account menu for ' + session.username"
                aria-controls="account-dropdown" [attr.aria-expanded]="accountMenuOpen()" (click)="toggleAccountMenu()">
          <span class="avatar" aria-hidden="true">{{ session.username.slice(0, 2).toUpperCase() }}</span>
          <span class="account-name">{{ session.username }}</span>
          <svg class="chevron" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path d="m4 6 4 4 4-4" />
          </svg>
        </button>
        @if (accountMenuOpen()) {
          <div class="account-dropdown" id="account-dropdown">
            <div class="account-summary">
              <span class="summary-label">Signed in as</span>
              <span class="summary-name">{{ session.username }}</span>
            </div>
            <button type="button" class="logout" (click)="auth.logout()">
              <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">
                <path d="M8 3H4.75A1.75 1.75 0 0 0 3 4.75v10.5A1.75 1.75 0 0 0 4.75 17H8M12.5 6.5 16 10l-3.5 3.5M16 10H7" />
              </svg>
              <span>Sign out</span>
            </button>
          </div>
        }
      </div>
    } @else {
      <span class="account-trigger guest">Guest</span>
    }
  </div>
</header>
